name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: py_compile
        run: python -m py_compile obs_launcher.py now_playing_daemon.py smtc_cmd.py
